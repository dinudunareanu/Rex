name: Build EXE and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name Rex App.py

      - name: Upload EXE as artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Rex-exe
          path: dist/Rex.exe

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist/Rex.exe -DestinationPath dist/Rex.zip

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-build-${{ github.run_number }}
          name: "Rex v1.0.1 (build ${{ github.run_number }})"
          body: |
            Automated build triggered by commit ${{ github.sha }}.

          files: dist/Rex.zip
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
